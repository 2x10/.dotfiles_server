#
# ~/.tmux.conf
#

run-shell '~/.tmux/init.sh'

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

set-option -g detach-on-destroy off
set -g mouse on

# fix copy pasting
set -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'kitty +kitten clipboard'

# status bar
set -g status-style "bg=#2b2b2b,fg=#ffffff"
setw -g window-status-style "bg=#2b2b2b,fg=#ffffff"

set -g status-left ""
set -g status-right "#[fg=#888888]%H:%M"

set -g status-position top

set-option -g detach-on-destroy off

# pane border colors
set -g pane-border-style "fg=#2b2b2b"

bind -n C-a         switch-client -T cmd

# keybindings
bind -n M-t         new-window 

bind -T cmd e       run-shell "~/.tmux/plugins/treemux/scripts/toggle.sh 'nvim,~/.tmux/treemux_init.lua,,/usr/bin/python3,left,40,top,70%,editor,0.5,2,@treemux-refresh-interval-inactive-window,0,focus,nvim-tree' '#{pane_id}'" 
# panes

# create pane
bind -T cmd s       split-window -v
bind -T cmd S       split-window -h

# select pane layout
bind -T cmd 1       select-layout main-vertical
bind -T cmd 2       select-layout main-horizontal

# pane navigation
bind -n C-M-Left    select-pane -L
bind -n C-M-Right   select-pane -R
bind -n C-M-Up      select-pane -U
bind -n C-M-Down    select-pane -D

# resize panes
bind -n M-S-Left    resize-pane -L 5
bind -n M-S-Right   resize-pane -R 5
bind -n M-S-Up      resize-pane -U 3
bind -n M-S-Down    resize-pane -D 3

# KILLll!!! !!! !! !
bind -T cmd c       kill-window
bind -n M-c         kill-pane

# window switching
bind -n M-0         select-window -t :0
bind -n M-1         select-window -t :1
bind -n M-2         select-window -t :2
bind -n M-3         select-window -t :3
bind -n M-4         select-window -t :4
bind -n M-5         select-window -t :5
bind -n M-6         select-window -t :6
bind -n M-7         select-window -t :7
bind -n M-8         select-window -t :8
bind -n M-9         select-window -t :9

# window cycling
bind -n M-Left      previous-window
bind -n M-Right     next-window

# Reload config
bind -T cmd r              source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @treemux-tree-client 'nvim-tree'  # or 'neo-tree'
set -g @treemux-tree-nvim-init-file '~/.tmux/treemux_init.lua'
set -g @plugin 'kiyoon/treemux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
